[package]
name = "yunzii-b75-tui"
version = "0.1.0"
edition = "2024"
# Bumped from 1.85 for Milestone 4: the `gif` feature of `image` only
# resolves from 0.25.10 onward (earlier 0.25.x require a `gif` crate version
# that was never published), and 0.25.10 needs 1.88. The alternative was to
# depend on the low-level `gif` crate and hand-roll frame disposal and
# sub-rectangle compositing, which plan review specifically blocked.
rust-version = "1.88"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
clap = { version = "4.6.6", features = ["derive"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif"] }
nix = { version = "0.31.3", features = ["poll", "fs"] }
# Only the crossterm backend. The default set also pulls termwiz and termion,
# which this never uses -- two more terminal libraries compiled in to be
# ignored. `underline-color` is kept because the default theme expects it.
ratatui = { version = "0.30", default-features = false, features = [
    "crossterm",
    "underline-color",
] }

[dev-dependencies]
serde_json = "1.0.151"
tempfile = "3.27.0"
